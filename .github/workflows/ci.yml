name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: ubuntu-24.04-arm
            system: aarch64-linux
          - os: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: angr-nix
          authToken: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.CACHIX_AUTH_TOKEN || '' }}

      - name: Build angr
        run: nix build .#packages.${{ matrix.system }}.angr -L

      - name: Smoke test
        run: |
          nix run .#packages.${{ matrix.system }}.default -- -c "
          import angr, shutil
          ls = shutil.which('ls')
          p = angr.Project(ls, auto_load_libs=False)
          print('arch:', p.arch)
          print('entry:', hex(p.entry))
          "
